[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voidfarer"
version = "0.1.0"
description = "A deep-space fleet, procedural galaxy, and holographic cockpit simulation engine"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AI Assistant" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment :: Simulation",
]

[project.scripts]
voidfarer = "voidfarer.cli:main"
